<mat-card class="device-card" appearance="outlined">
  <mat-card-header>
    @if (deviceInfo() && deviceInfo().summary && deviceInfo().summary.deviceName) {
      <mat-card-title>{{ deviceInfo().summary.deviceName }}</mat-card-title>
    } @else {
      <mat-card-title>Device Name Unavailable</mat-card-title>
    }
  </mat-card-header>
  <div class="device-card-content">
    <div>{{ averageTemperatureDisplay() }}</div>
  </div>
  <mat-card-actions class="button-container">
    @if (this.deviceInfo() && this.deviceInfo().entityId) {
      <button matButton="outlined" (click)="viewDeviceById()">View</button>
      <button matButton="filled" (click)="deleteDeviceConfirmation()">
        <mat-icon>delete</mat-icon>Delete
      </button>
    }
  </mat-card-actions>
</mat-card>
