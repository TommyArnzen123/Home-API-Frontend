<mat-card
  class="threshold-card"
  [class.temperature-threshold-healthy]="averageTemperature() && !isTemperatureThresholdInViolation"
  [class.temperature-threshold-violation]="
    averageTemperature() && isTemperatureThresholdInViolation
  "
  appearance="outlined"
>
  <mat-card-header>
    <div class="title-row">
      <mat-card-title>Temperature Threshold</mat-card-title>
      <div>
        <div class="temperature-threshold-alert-row">
          @if (averageTemperature()) {
            @if (isTemperatureThresholdInViolation) {
              <icon-element
                src="alert-location-temperature-icon"
                [width]="25"
                [height]="25"
                alt="Red circle alert icon."
              />
              <div>Alert</div>
            } @else {
              <icon-element
                src="healthy-location-temperature-icon"
                [width]="25"
                [height]="25"
                alt="Green circle alert icon."
              />
              <div>Healthy</div>
            }
          } @else {
            <icon-element
              src="no-data-location-temperature-icon"
              [width]="25"
              [height]="25"
              alt="Triangle with border and exclamation mark alert icon."
            />
            <div>No Reading</div>
          }
        </div>
      </div>
    </div>
  </mat-card-header>
  <div class="threshold-card-content">
    @if (minTemperature) {
      <div>Min Temp: {{ minTemperatureDisplay }}</div>
    }
    @if (maxTemperature) {
      <div>Max Temp: {{ maxTemperatureDisplay }}</div>
    }
  </div>
  <mat-card-actions>
    <div class="button-container">
      <button matButton="filled" (click)="displayTemperatureThresholdModal()">
        Update Threshold
      </button>
      <delete-button-element [action]="deleteTemperatureThresholdConfirmation" />
    </div>
  </mat-card-actions>
</mat-card>
