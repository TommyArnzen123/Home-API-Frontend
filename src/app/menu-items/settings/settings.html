<h1>Settings</h1>

<div class="settings-options-container">
  <div>Temperature Display (Fahrenheit or Celsius)</div>
  <section>
    <mat-button-toggle-group
      #groupTemp="matButtonToggleGroup"
      [value]="temperatureDisplaySetting()"
      (change)="updateTemperatureDisplaySetting($event, groupTemp)"
      aria-label="Temperature Display Setting"
    >
      <mat-button-toggle value="FAHRENHEIT">Fahrenheit</mat-button-toggle>
      <mat-button-toggle value="CELSIUS">Celsius</mat-button-toggle>
    </mat-button-toggle-group>
  </section>
  <div>Time Display (12 Hour or 24 Hour)</div>
  <section>
    <mat-button-toggle-group
      #groupTime="matButtonToggleGroup"
      [value]="timeDisplaySetting()"
      (change)="updateTimeDisplaySetting($event, groupTime)"
      aria-label="Time Display Setting"
    >
      <mat-button-toggle value="HOUR_12">12 Hour</mat-button-toggle>
      <mat-button-toggle value="HOUR_24">24 Hour</mat-button-toggle>
    </mat-button-toggle-group>
  </section>
  <div>Theme Display</div>
  <section>
    <mat-button-toggle-group
      #groupTheme="matButtonToggleGroup"
      [value]="themeDisplaySetting()"
      (change)="updateThemeDisplaySetting($event, groupTheme)"
      aria-label="Theme Display Setting"
    >
      <mat-button-toggle value="LIGHT">Light</mat-button-toggle>
      <mat-button-toggle value="DARK">Dark</mat-button-toggle>
    </mat-button-toggle-group>
  </section>
</div>
