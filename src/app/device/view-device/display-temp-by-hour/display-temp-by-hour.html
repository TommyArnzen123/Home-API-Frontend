<mat-card
  class="average-temperature-container"
  [class.hot-background]="backgroundDisplayStyle() === 'HOT'"
  [class.temperate-background]="backgroundDisplayStyle() === 'TEMPERATE'"
  [class.cold-background]="backgroundDisplayStyle() === 'COLD'"
  appearance="outlined"
>
  @if (currentHour !== hour()) {
    <div class="text-display">{{ hourDisplay() }}</div>
  } @else {
    <div>Now</div>
  }
  <div>
    @if (temperature(); as temp) {
      @if (temp > 80) {
        <icon-element
          src="thermometer-alert-icon"
          [width]="30"
          [height]="30"
          alt="Red thermometer icon."
        />
      } @else if (temp < 60) {
        <icon-element
          src="thermometer-cold-icon"
          [width]="30"
          [height]="30"
          alt="Blue thermometer icon."
        />
      } @else {
        <icon-element
          src="thermometer-temperate-icon"
          [width]="30"
          [height]="30"
          alt="Orange thermometer icon."
        />
      }
    } @else {
      <icon-element
        src="no-data-location-temperature-icon"
        [width]="30"
        [height]="30"
        alt="Triangle with border and exclamation mark alert icon."
      />
    }
  </div>
  @if (temperatureDisplay() !== undefined) {
    <div class="text-display">{{ temperatureDisplay() }}</div>
  } @else {
    <div>N/A</div>
  }
</mat-card>
