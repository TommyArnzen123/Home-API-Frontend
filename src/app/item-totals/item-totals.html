<h2>Summary</h2>
<div class="items-display">
  @if (displayTotalHomes) {
    <div class="item-display">
      <div>
        <icon-element src="home-icon-summary" [width]="100" [height]="100" alt="Home icon." />
      </div>
      <div class="item-title">Total Homes</div>
      <div class="item-value">{{ totalHomes }}</div>
    </div>
  }

  @if (displayTotalLocations) {
    <div class="item-display">
      <div>
        <icon-element src="location-icon" [width]="100" [height]="100" alt="Location icon." />
      </div>
      <div class="item-title">Total Locations</div>
      <div class="item-value">{{ totalLocations }}</div>
    </div>
  }

  @if (displayTotalDevices) {
    <div class="item-display">
      <div>
        <icon-element src="device-icon" [width]="100" [height]="100" alt="Device icon." />
      </div>
      <div class="item-title">Total Devices</div>
      <div class="item-value">{{ totalDevices }}</div>
    </div>
  }
</div>
