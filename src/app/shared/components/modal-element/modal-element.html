<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  {{ content }}

  @if (footer) {
    <br />
    <br />
    {{ footer }}
  }
</mat-dialog-content>
<mat-dialog-actions>
  <div class="button-container">
    @if (secondaryText) {
      <button matButton="outlined" class="button-item" (click)="secondaryButtonAction()">
        {{ secondaryText }}
      </button>
    }

    @if (primaryIntent === ButtonIntent.PRIMARY) {
      <button matButton="filled" class="button-item" (click)="primaryButtonAction()">
        {{ primaryText }}
      </button>
    } @else if (primaryIntent === ButtonIntent.DESTRUCTIVE) {
      <delete-button-element
        class="button-item"
        [buttonText]="primaryText"
        [action]="primaryButtonAction"
      />
    }
  </div>
</mat-dialog-actions>
